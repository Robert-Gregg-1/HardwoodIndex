*{box-sizing:border-box}
input,textarea,button{font:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
header{background:var(--blue);color:#fff;border-bottom:5px solid var(--red)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
header .wrap{padding:12px 16px 16px}
h1{margin:0;font-size:clamp(30px,8vw,44px);letter-spacing:-.02em;line-height:1.1}
.kicker{margin-top:4px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.bar button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.bar button.edb{border-color:var(--red);color:var(--red);font-weight:600}
.wk{margin-left:auto;color:var(--mute);font-size:13px;text-align:right}
.row{display:grid;grid-template-columns:36px 52px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 22px;margin-bottom:8px;background:linear-gradient(90deg,var(--p) 0 8px,var(--s) 8px 12px,var(--card) 12px)}
.ed .row{grid-template-columns:48px 52px 1fr auto}
.rk{font-size:24px;font-weight:800;text-align:center}
.bd{width:52px;height:52px;border-radius:12px;background:var(--p);color:var(--pt);box-shadow:0 0 0 3px var(--ring,var(--s));display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.04em;overflow:hidden}
.bd.lg{background:#fff;padding:5px}
.bd img{width:100%;height:100%;object-fit:contain}
.nm{font-weight:700;font-size:16px}
.meta{color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:13px;margin-top:2px}
.mv{font-weight:700;font-size:14px;text-align:right;min-width:44px}
.up{color:#16a34a}.down{color:#dc2626}.flat{color:var(--mute)}
.tier{margin:20px 0 8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tier);border-bottom:2px solid var(--line);padding-bottom:4px}
.in,.panel input,.panel textarea,.rn{border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 8px;font-size:14px;width:100%}
.in{margin-top:4px;font-size:13px}.in.rec{width:90px}
.rn{text-align:center;font-weight:800;font-size:18px;padding:4px 0}
.mvb{display:flex;flex-direction:column;gap:4px}
.mvb button,.panel button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;display:grid;gap:10px}
.panel label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.acts{display:flex;gap:8px}
.panel button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px;box-shadow:inset 0 -2px 0 var(--line)}
.tabs button{border:0;background:none;color:var(--mute);padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.row[data-row]{cursor:pointer}.was{font-size:11px;color:var(--mute);font-weight:400;max-width:120px;margin-left:auto;line-height:1.25}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.md{background:var(--card);color:var(--ink);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px;border-top:6px solid var(--p)}
.md h2{margin:0;font-size:22px}.md p{margin:8px 0}.mh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.x{float:right;border:0;background:none;color:var(--mute);font-size:26px;cursor:pointer;line-height:1}
.hs{overflow-x:auto}.ht{border-collapse:collapse;width:100%;font-size:14px}
.ht th,.ht td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.ht th:first-child,.ht td:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:var(--bg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mvr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mvc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.mvc h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.mvc.u h3{color:#16a34a}.mvc.d h3{color:#dc2626}
.mi{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;min-width:0}
.mi .bd{width:30px;height:30px;font-size:10px;border-radius:8px;box-shadow:0 0 0 2px var(--ring,var(--s));flex:none}
.mi .bd.lg{padding:3px}
.mi b{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sg div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center}
.sg b{display:block;font-size:17px}.sg span{font-size:11px;color:var(--mute)}
.sg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lk{display:flex;gap:6px;margin-top:14px}
.lk input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 8px;font-size:12px}
.lk button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.hd{display:flex;align-items:center;gap:14px}.brand{width:60px;height:60px;flex:none;object-fit:contain}
#hlSel{border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:5px 8px;font-size:14px}
.hc{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;padding:8px 12px}
.cf{margin:20px 0 6px;font-size:18px;font-weight:800;border-bottom:3px solid var(--blue);padding-bottom:4px}
.ps,.ar select{border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:5px 8px;font-size:14px;max-width:100%}
.ar{display:grid;grid-template-columns:28px 44px 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
.ar>b{font-size:20px;text-align:center}.ar .bd{width:44px;height:44px;font-size:12px;border-radius:10px}
.ar.e{grid-template-columns:28px 1fr}.ag{display:grid;gap:4px}
#pMain{display:grid;gap:10px}
.bd.lg{display:flex;align-items:center;justify-content:center}
.bd img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.wg label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.wg input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:4px 6px;font-size:14px}
@media (max-width:420px){.row,.ed .row{grid-template-columns:44px 42px 1fr auto;gap:8px;padding-left:20px}.bd{width:42px;height:42px;font-size:12px}}
</style>
</head>

<script>
const S0 = JSON.parse(document.getElementById("state").textContent);
const LOGOS = JSON.parse(document.getElementById("logos").textContent);
// name, conference, primary, secondary
const TEAMS = {ATL:["Atlanta Hawks","E","#E03A3E","#C1D32F"],BOS:["Boston Celtics","E","#007A33","#BA9653"],BKN:["Brooklyn Nets","E","#000000","#FFFFFF"],CHA:["Charlotte Hornets","E","#1D1160","#00788C"],CHI:["Chicago Bulls","E","#CE1141","#000000"],CLE:["Cleveland Cavaliers","E","#860038","#FDBB30"],DAL:["Dallas Mavericks","W","#00538C","#002B5E"],DEN:["Denver Nuggets","W","#0E2240","#FEC524"],DET:["Detroit Pistons","E","#C8102E","#1D42BA"],GSW:["Golden State Warriors","W","#1D428A","#FFC72C"],HOU:["Houston Rockets","W","#CE1141","#000000"],IND:["Indiana Pacers","E","#002D62","#FDBB30"],LAC:["LA Clippers","W","#C8102E","#1D428A"],LAL:["Los Angeles Lakers","W","#552583","#FDB927"],MEM:["Memphis Grizzlies","W","#5D76A9","#12173F"],MIA:["Miami Heat","E","#98002E","#F9A01B"],MIL:["Milwaukee Bucks","E","#00471B","#EEE1C6"],MIN:["Minnesota Timberwolves","W","#0C2340","#236192"],NOP:["New Orleans Pelicans","W","#0C2340","#C8102E"],NYK:["New York Knicks","E","#006BB6","#F58426"],OKC:["Oklahoma City Thunder","W","#007AC1","#EF3B24"],ORL:["Orlando Magic","E","#0077C0","#C4CED4"],PHI:["Philadelphia 76ers","E","#006BB6","#ED174C"],PHX:["Phoenix Suns","W","#1D1160","#E56020"],POR:["Portland Trail Blazers","W","#E03A3E","#000000"],SAC:["Sacramento Kings","W","#5A2D81","#63727A"],SAS:["San Antonio Spurs","W","#C4CED4","#000000"],TOR:["Toronto Raptors","E","#CE1141","#000000"],UTA:["Utah Jazz","W","#002B5C","#00471B"],WAS:["Washington Wizards","E","#002B5C","#E31837"]};
S0.history = S0.history || [{week:S0.week, order:S0.order}]; S0.analysis = S0.analysis || {}; S0.stats = S0.stats || {}; S0.pred = S0.pred || {champs:{}, awards:{}, bold:[{},{},{}]}; S0.pred.order = S0.pred.order || {}; ["E","W"].forEach(c => { const a = S0.pred.order[c] || []; S0.pred.order[c] = Array.from({length:15}, (_, i) => a[i] || ""); }); S0.awards = S0.awards || {}; S0.playoff = S0.playoff || {E:S0.order.filter(id => TEAMS[id][1]==="E").slice(0,10), W:S0.order.filter(id => TEAMS[id][1]==="W").slice(0,10)};
let draft = null, filter = "ALL", view = "rank", ART = null, SMP = null, DL = null, hl = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tc = h => { const n = parseInt(h.slice(1),16); return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255)) > 150 ? "#111" : "#fff"; };
function tierOf(r, tiers){ let a = 0; for (const t of tiers){ a += t.size; if (r <= a) return t.name; } return null; }
function render(){
  const S = draft || S0, ed = !!draft, starts = {}; let a = 1;
  S.tiers.forEach(t => { starts[a] = t.name; a += t.size; });
  const prev = ed && S.week !== S0.week ? S0.order : S.prev;
  $("wk").innerHTML = esc(S.week) + "<br>Records as of " + esc(S.asOf);
  $("movers").innerHTML = view==="rank" && !ed ? moversHTML() : "";
  document.querySelectorAll("#bar button[data-f]").forEach(b => { b.style.display = view==="rank" || view==="hist" ? "" : "none"; });
  const pm = $("pMain"); if (pm) pm.style.display = view==="rank" ? "" : "none";
  if (view==="playoff"){ $("list").innerHTML = playoffHTML(S, ed); document.body.className = ed ? "ed" : ""; return; }
  if (view==="awards"){ $("list").innerHTML = awardsHTML(S, ed); document.body.className = ed ? "ed" : ""; return; }
  if (view==="pred"){ $("list").innerHTML = predHTML(S, ed); document.body.className = ed ? "ed" : ""; return; }
  if (view==="hist" && !ed){ $("list").innerHTML = histHTML(); document.body.className = ""; return; }
  const out = [];
  S.order.forEach((id,i) => {
    const rank = i+1, [name,conf,p,s] = TEAMS[id];
    if (starts[rank] && (filter==="ALL" || ed)) out.push('<div class="tier">'+esc(starts[rank])+'</div>');
    if (!ed && filter!=="ALL" && conf!==filter) return;
    let mv = '<span class="flat">–</span>';
    if (prev){ const d = prev.indexOf(id)+1-rank; if (d>0) mv='<span class="up">▲ '+d+'</span>'; else if (d<0) mv='<span class="down">▼ '+(-d)+'</span>'; }
    if (prev && !ed){ const pr = prev.indexOf(id)+1, ptn = tierOf(pr, S.prevTiers || S.tiers), ctn = tierOf(rank, S.tiers); mv += '<div class="was">Prev: #'+pr+'</div>'+(ptn && ctn && ptn!==ctn ? '<div class="was">Prev tier: '+esc(ptn)+'</div>' : ''); }
    const badge = LOGOS[id] ? '<div class="bd lg"'+(id==="BKN"?' style="--ring:#000000"':'')+'><img src="'+LOGOS[id]+'" alt="'+name+' logo"></div>' : '<div class="bd">'+id+'</div>';
    const rec = S.records[id] || "0-0", note = S.notes[id] || "";
    const rk = ed ? '<input class="rn" type="number" min="1" max="30" value="'+rank+'" data-id="'+id+'" data-k="rank">' : rank;
    const info = ed
      ? '<div class="nm">'+name+'</div><input class="in rec" value="'+esc(S.records[id]||"")+'" placeholder="0-0" data-id="'+id+'" data-k="rec"><input class="in" value="'+esc(note)+'" placeholder="Note" data-id="'+id+'" data-k="note">'
      : '<div class="nm">'+name+'</div><div class="meta">'+(conf==="E"?"East":"West")+' · '+esc(rec)+'</div>'+(note?'<div class="note">'+esc(note)+'</div>':'');
    const right = ed ? '<div class="mvb"><button data-act="up" data-id="'+id+'">▲</button><button data-act="dn" data-id="'+id+'">▼</button></div><div class="mv">'+mv+'</div>' : '<div class="mv">'+mv+'</div>';
    out.push('<div class="row"'+(ed?'':' data-row="'+id+'"')+' style="--p:'+p+';--s:'+s+';--pt:'+tc(p)+'"><div class="rk">'+rk+'</div>'+badge+'<div>'+info+'</div>'+(ed?'<div>'+right+'</div>':right)+'</div>');
  });
  $("list").innerHTML = out.join("");
  document.body.className = ed ? "ed" : "";
}
$("bar").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#bar button[data-f]").forEach(x => x.classList.toggle("on", x===b));
  render();
});
function setTabs(){ document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v===view)); }
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || (draft && b.dataset.v==="hist")) return; view = b.dataset.v; setTabs(); render(); tabMsg(); });
const lum = h => { const n = parseInt(h.slice(1),16); return 0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255); };
function lineColor(id){ const t = TEAMS[id], ok = h => lum(h)>=45 && lum(h)<=190; return ok(t[2]) ? t[2] : ok(t[3]) ? t[3] : "#6b7280"; }
function chartHTML(){
  const H = S0.history;
  if (H.length < 2) return '<div class="meta" style="margin-bottom:12px">The rank chart appears after the second week.</div>';
  const W = 720, Ht = 560, L = 34, R = 64, T = 14, B = 40, px = k => L+k*(W-L-R)/(H.length-1), py = r => T+(r-1)*(Ht-T-B)/29;
  const ids = S0.order.filter(id => filter==="ALL" || TEAMS[id][1]===filter).sort((a,b) => (a===hl)-(b===hl));
  let o = '<div class="hc"><label class="meta">Highlight: <select id="hlSel"><option value="">All teams</option>'+Object.keys(TEAMS).sort((a,b) => TEAMS[a][0].localeCompare(TEAMS[b][0])).map(k => '<option value="'+k+'"'+(k===hl?' selected':'')+'>'+TEAMS[k][0]+'</option>').join("")+'</select></label><span class="meta">or tap a line</span></div>';
  o += '<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Rank by week for each team">';
  [1,5,10,15,20,25,30].forEach(r => { o += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py(r)+'" y2="'+py(r)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(py(r)+4)+'" font-size="11" fill="var(--mute)" text-anchor="end">'+r+'</text>'; });
  const step = Math.ceil(H.length/8);
  H.forEach((h,k) => { if (k%step===0 || k===H.length-1) o += '<text x="'+px(k)+'" y="'+(Ht-14)+'" font-size="11" fill="var(--mute)" text-anchor="middle">'+esc(h.week)+'</text>'; });
  ids.forEach(id => {
    const rs = H.map(h => h.order.indexOf(id)+1), on = hl===id, c = lineColor(id), pts = rs.map((r,k) => px(k)+','+py(r)).join(" ");
    o += '<g data-hl="'+id+'" style="cursor:pointer" opacity="'+(hl && !on ? 0.2 : on ? 1 : 0.85)+'"><polyline fill="none" stroke="transparent" stroke-width="12" points="'+pts+'"/><polyline fill="none" stroke="'+c+'" stroke-width="'+(on?4:2)+'" stroke-linejoin="round" points="'+pts+'"/>';
    if (on) o += rs.map((r,k) => '<circle cx="'+px(k)+'" cy="'+py(r)+'" r="4.5" fill="'+c+'"><title>'+esc(H[k].week)+': #'+r+'</title></circle>').join("");
    o += '<text x="'+(W-R+8)+'" y="'+(py(rs[rs.length-1])+4)+'" font-size="11" font-weight="'+(on?800:700)+'" fill="'+c+'">'+id+'</text></g>';
  });
  return o + '</svg>';
}
$("list").addEventListener("click", e => { const g = e.target.closest("[data-hl]"); if (g && view==="hist" && !draft){ hl = hl===g.dataset.hl ? null : g.dataset.hl; render(); } });
$("list").addEventListener("change", e => { if (e.target.id==="hlSel"){ hl = e.target.value || null; render(); } });
function histHTML(){
  const H = S0.history, th = H.map(h => '<th>'+esc(h.week)+'</th>').join("");

  else draft.notes[id] = t.value.trim();
});
async function save(){
  const n = JSON.parse(JSON.stringify(draft)); if (n.week !== S0.week) { n.prev = S0.order; n.prevTiers = S0.tiers; }
  n.history = n.history || []; const hi = n.history.findIndex(h => h.week === n.week); if (hi >= 0) n.history[hi] = {week:n.week, order:n.order}; else n.history.push({week:n.week, order:n.order});
  const c = document.documentElement.cloneNode(true);
  c.querySelector("#state").textContent = JSON.stringify(n).replace(/</g,"\\u003c");
  ["list","wk","editbox","adm","modal","movers","shr"].forEach(i => c.querySelector("#"+i).innerHTML = "");
  c.querySelector("body").className = "";
  c.querySelectorAll("#bar button[data-f]").forEach(b => b.classList.toggle("on", b.dataset.f==="ALL"));
  c.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v==="rank"));
  try { sessionStorage.setItem("hi_view", view); } catch(_) {}
  
  dl("index.html", "<!DOCTYPE html>\n"+c.outerHTML, "text/html");
  $("eMsg").textContent = "Downloaded index.html. Upload it to your GitHub repository to publish the update.";
}

if (location.hash === "#edit") showEdit();
window.addEventListener("hashchange", () => { if (location.hash === "#edit" && !draft) showEdit(); });
try { const v = sessionStorage.getItem("hi_view"); if (v){ sessionStorage.removeItem("hi_view"); if (["rank","hist","playoff","awards","pred"].includes(v)){ view = v; setTabs(); } } } catch(_) {}
render();
openFromHash();
